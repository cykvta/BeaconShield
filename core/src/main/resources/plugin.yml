name: BeaconShield
version: '${project.version}'
main: icu.cykuta.beaconshield.BeaconShield
api-version: '1.20'
soft-depend: [Vault, WorldGuard, WorldEdit, PlaceholderAPI]

# Command permissions (beaconshield.command, .give, .invite, ...) are declared
# by the commands themselves and registered on startup, so they are not
# repeated here. Only the nodes that belong to no command are listed below.
permissions:
  beaconshield.bypass:
    description: Bypass all territory protection checks
    default: op
  beaconshield.update-notify:
    description: Be told on join when a new version is available
    default: op
